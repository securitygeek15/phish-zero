services:
  phish-zero:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phish-zero
    image: phish-zero:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
